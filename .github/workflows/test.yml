name: Linux

on: [push, pull_request]

jobs:

  test_linux:
    runs-on: "ubuntu-24.04"
    name: "Ubuntu 24.04 - Python ${{ matrix.python-version }}"
    env:
      USING_COVERAGE: '3.11'

    strategy:
      max-parallel: 3
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.8", "pypy3.9", "pypy3.10"]
        redis-version: [7]

    steps:
      - uses: "actions/checkout@v6"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"
          cache-dependency-path: |
            **/setup.py
            **/requirements*.txt

      - name: "Install dependencies"
        run: |
          set -xe
          sudo apt-get install -y libxml2-dev libxslt-dev
          python -VV
          python -m pip install --upgrade pip setuptools wheel codecov
          python -m pip install -e .
          python -m pip install -r requirements-pytest.txt
          python -m pip install -r requirements-docs.txt

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: ${{ matrix.redis-version }}

      - name: "Run tests for ${{ matrix.python-version }}"
        env: 
          CLUBLOG_APIKEY: ${{ secrets.CLUBLOG_APIKEY }}
          QRZ_USERNAME: ${{ secrets.QRZ_USERNAME }}
          QRZ_PWD: ${{ secrets.QRZ_PWD }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        # delay the execution by a couple of seconds to reduce the amount 
        # of concurrent API calls on Clublog and QRZ.com when all CI jobs execute simultaneously
        run: |
          sleep $[ ( $RANDOM % 60 )  + 1 ]s 
          if [[ $PYTHON_VERSION == 3.11 ]]
          then 
            pytest --cov=test/
            codecov
          else
            pytest test/
          fi
          cd docs && make html


